<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Text Anonymizer</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <main class="container">
        <h1>Text Anonymizer</h1>
        <p class="lead">All processing happens in your browser — nothing is sent anywhere.</p>

        <section class="panel">
            <label class="muted">Original</label>
            <textarea id="original" placeholder="Paste text to anonymize"></textarea>
            <div class="flex-gap">
                <button id="anonymizeBtn">Anonymize</button>
                <button id="clearOriginalBtn" class="secondary">Clear</button>
            </div>
        </section>

        <section class="panel">
            <label class="muted">User-defined mapping</label>
            <table class="mapping-table" aria-label="User-defined mapping">
                <thead>
                    <tr>
                        <th>original</th>
                        <th>placeholder</th>
                    </tr>
                </thead>
                <tbody id="userMapRows"></tbody>
            </table>
            <div class="row">
                <button id="applyUserMapBtn">Apply</button>
                <button id="addUserMapRowBtn" class="secondary">Add row</button>
                <button id="importUserMapBtn" class="secondary">Import JSON</button>
                <input id="importUserMapInput" class="visually-hidden" type="file" accept=".json,application/json">
                <button id="clearUserMapBtn" class="secondary">Clear</button>
            </div>
            <pre id="userMapDisplay"></pre>
            <div class="row" style="margin-top:8px">
                <button id="exportUserMapBtn" class="secondary" style="display:none">Download</button>
            </div>
        </section>

        <section class="panel" id="resultSection" style="display:none">
            <label class="muted">Anonymized</label>
            <textarea id="anonymized" readonly></textarea>
            <div class="row" style="margin-top:8px">
                <button id="copyAnonymizedBtn">Copy</button>
            </div>

            <label class="muted" style="margin-top:10px">Mapping</label>
            <pre id="mappingDisplay"></pre>
            <div class="row" style="margin-top:8px">
                <button id="downloadMappingBtn" class="secondary">Download</button>
            </div>
        </section>

        <section class="panel">
            <label class="muted">Deanonymize</label>
            <textarea id="toRestore" placeholder="Paste anonymized text"></textarea>
            <div class="row" style="margin-top:8px">
                <button id="restoreBtn">Restore</button>
                <button id="clearRestoreBtn" class="secondary">Clear</button>
            </div>
            <pre id="restored"></pre>
            <div class="row" style="margin-top:8px">
                <button id="copyRestoredBtn" style="display:none">Copy</button>
            </div>
        </section>
        </br>
    </main>

    <script type="module" src="src/anon.js"></script>
</body>
</html>
