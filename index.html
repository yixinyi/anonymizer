<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Text Anonymizer</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <main class="container">
        <h1>Text Anonymizer</h1>
        <p class="lead">All processing happens in your browser — nothing is sent anywhere.</p>

        <section class="panel">
            <label class="muted">Original</label>
            <textarea id="original" placeholder="Paste text to anonymize"></textarea>
            <div class="flex-gap">
                <button id="anonymizeBtn">Anonymize</button>
            </div>
        </section>

        <section class="panel">
            <label class="muted">User-defined mapping (JSON or lines)</label>
            <textarea id="userMapInput" placeholder='Example: John Doe => [PERSON_1]' style="height:80px"></textarea>
            <div class="row">
                <button id="applyUserMapBtn">Apply</button>
                <button id="clearUserMapBtn" class="secondary">Clear</button>
            </div>
            <pre id="userMapDisplay"></pre>
        </section>

        <section class="panel" id="resultSection" style="display:none">
            <label class="muted">Anonymized</label>
            <textarea id="anonymized" readonly></textarea>
            <div class="row" style="margin-top:8px">
                <button id="copyAnonymizedBtn">Copy</button>
            </div>

            <label class="muted" style="margin-top:10px">Mapping (save this)</label>
            <pre id="mappingDisplay"></pre>
            <div class="row" style="margin-top:8px">
                <button id="copyMappingBtn">Copy JSON</button>
                <button id="downloadMappingBtn" class="secondary">Download</button>
            </div>
        </section>

        <section class="panel">
            <label class="muted">Deanonymize</label>
            <textarea id="toRestore" placeholder="Paste anonymized text"></textarea>
            <textarea id="mappingInput" placeholder='Paste mapping JSON' style="height:80px;margin-top:8px"></textarea>
            <div class="row" style="margin-top:8px">
                <button id="restoreBtn">Restore</button>
            </div>
            <pre id="restored"></pre>
        </section>
    </main>

    <script type="module" src="src/anon.js"></script>
</body>
</html>
